apiVersion: v1
kind: Service
metadata:
  name: identity
  labels: { app.kubernetes.io/name: identity, app.kubernetes.io/part-of: routego }
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: identity }
  ports:
    - { name: http, port: 80, targetPort: http }   # other services call http://identity/
